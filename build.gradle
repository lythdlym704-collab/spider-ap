plugins {
    id 'com.android.application' version '8.1.4'
    id 'org.jetbrains.kotlin.android' version '1.9.10'
}

// يحوّل icon.b64 إلى صورة أيقونة أثناء البناء
tasks.register('genIcon') {
    def src = new File(rootDir, 'icon.b64')
    def out = new File(buildDir, 'generated/icon/mipmap-xxhdpi')
    doLast {
        out.mkdirs()
        def clean = src.text.replaceAll('\\s', '')
        new File(out, 'ic_launcher.png').bytes = java.util.Base64.getDecoder().decode(clean)
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'genIcon' }

android {
    namespace 'com.aim.ipadview'
    compileSdk 34
    defaultConfig {
        applicationId "com.aim.ipadview"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDir("$buildDir/generated/icon")
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
